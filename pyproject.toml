[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "dnaslseq2fasta"
dynamic = ["version"]
readme = "README.md"

dependencies = [
]

requires-python = ">=3.12"
description = "Converts DNAStar Lasergene .seq files to fasta files."
license = "GPL-3.0-or-later"

[project.urls]
Homepage = "https://github.com/RealYHD/dnaslseq2fasta"
Source = "https://github.com/RealYHD/dnaslseq2fasta"
Issues = "https://github.com/RealYHD/dnaslseq2fasta/issues"

[project.scripts]
dnaslseq2fasta = "dnaslseq2fasta.ui.cli.program:main"

[tool.setuptools_scm]

[tool.pyright]
extraPaths = ["src"]
exclude = [
    "**/node_modules",
    "**/__pycache__"
]
executionEnvironments = [
    {root = "src"}
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
pythonpath = [
    "src"
]
addopts = [
    "--import-mode=importlib",
]
asyncio_mode = "auto"

[tool.pylint.main]
source-roots = "src"

[tool.pylint.format]
# Maximum number of characters on a single line.
max-line-length = 88

